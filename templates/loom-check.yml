name: Loom check

on:
  pull_request:
  push:

jobs:
  loom-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check Loom conventions
        run: python3 loom_cli.py check .
